<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Edit {{ title }} — pancake-review</title>
  <style>
    :root { --ink: #1d1d1f; --muted: #6b6b70; --line: #d9d9dd; --maple: #c47a2c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #f7f7f5; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 900px; min-height: 100vh; margin: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
    h1 { margin: 0 0 12px; font-size: 1.15rem; line-height: 1.3; }
    form { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    textarea {
      width: 100%; flex: 1; min-height: 65vh; resize: vertical; padding: 14px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
      font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .actions { display: flex; gap: 10px; position: sticky; bottom: 0; padding-top: 4px; }
    .button {
      flex: 1; display: block; padding: 12px 16px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; color: var(--ink); text-align: center;
      text-decoration: none; font-size: 1rem; font-weight: 650; cursor: pointer;
    }
    button.button { background: var(--maple); color: #fff; border-color: var(--maple); }
    .hint { margin: 0 0 10px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Edit source: {{ title }}</h1>
    <p class="hint">Saving writes this Markdown file directly. Existing review comments are unchanged.</p>
    <form method="post" action="{{ action }}">
      <textarea name="content" required spellcheck="true" aria-label="Markdown source">{{ content }}</textarea>
      <div class="actions">
        <a class="button" href="{{ reader_url }}">Cancel</a>
        <button class="button" type="submit">Save</button>
      </div>
    </form>
  </main>
</body>
</html>
