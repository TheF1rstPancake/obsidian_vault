[project]
name = "pancake-review"
version = "0.1.0"
description = "Local article annotation tool — highlight vault articles and leave notes for Hermes to resolve."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "markdown>=3.6",
    "jinja2>=3.1",
]

# No [build-system] on purpose: uv treats this as a virtual (non-package)
# project, so `uv sync` just installs the dependencies into .venv.
[tool.uv]
package = false
